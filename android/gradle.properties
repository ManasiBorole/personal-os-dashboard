org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Force API 36 for app and Flutter plugins (required by file_picker lifecycle).
android.compileSdk=36

# Avoid Kotlin incremental cache corruption (class-fq-name-to-source.tab errors).
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.caching.enabled=false
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.configureondemand=false
